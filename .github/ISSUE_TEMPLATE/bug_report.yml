name: Bug report
description: Report incorrect behavior with a sanitized reproduction.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities in DepGuard, use private security reporting instead.
        Remove credentials, personal paths, and private package names from examples.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and minimal reproduction
      description: Include the command, sanitized metadata, and relevant output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DepGuard version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Go version
      placeholder: macOS, Go 1.26.2
    validations:
      required: true
